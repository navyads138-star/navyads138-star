<svg width="1200" height="430" viewBox="0 0 1200 430"
xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#050509"/>
<stop offset="45%" stop-color="#10091C"/>
<stop offset="100%" stop-color="#050509"/>
</linearGradient>

<radialGradient id="purpleGlow">
<stop offset="0%" stop-color="#9B5CFF" stop-opacity=".45"/>
<stop offset="45%" stop-color="#7C3AED" stop-opacity=".18"/>
<stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
</radialGradient>

<radialGradient id="pinkGlow">
<stop offset="0%" stop-color="#EC4899" stop-opacity=".35"/>
<stop offset="50%" stop-color="#DB2777" stop-opacity=".12"/>
<stop offset="100%" stop-color="#DB2777" stop-opacity="0"/>
</radialGradient>

<linearGradient id="nameGradient" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#FFFFFF"/>
<stop offset="45%" stop-color="#D8B4FE"/>
<stop offset="100%" stop-color="#F9A8D4"/>
</linearGradient>

<pattern id="grid" width="45" height="45" patternUnits="userSpaceOnUse">
<path d="M45 0H0V45"
fill="none"
stroke="#A855F7"
stroke-opacity=".07"/>
</pattern>

<filter id="blur">
<feGaussianBlur stdDeviation="30"/>
</filter>

<filter id="glow">
<feGaussianBlur stdDeviation="3" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

</defs>


<!-- BACKGROUND -->

<rect width="1200" height="430" rx="24"
fill="url(#background)"/>

<rect width="1200" height="430" rx="24"
fill="url(#grid)"/>


<!-- MOVING GLOW -->

<circle cx="120" cy="100" r="180"
fill="url(#purpleGlow)"
filter="url(#blur)">

<animate attributeName="cx"
values="120;220;120"
dur="8s"
repeatCount="indefinite"/>

<animate attributeName="cy"
values="100;180;100"
dur="7s"
repeatCount="indefinite"/>

</circle>


<circle cx="1080" cy="320" r="210"
fill="url(#pinkGlow)"
filter="url(#blur)">

<animate attributeName="cx"
values="1080;970;1080"
dur="9s"
repeatCount="indefinite"/>

<animate attributeName="cy"
values="320;240;320"
dur="8s"
repeatCount="indefinite"/>

</circle>


<!-- PARTICLES -->

<g fill="#C084FC">

<circle cx="90" cy="70" r="2">
<animate attributeName="cy"
values="70;40;70"
dur="4s"
repeatCount="indefinite"/>
</circle>

<circle cx="180" cy="300" r="2">
<animate attributeName="cy"
values="300;260;300"
dur="5s"
repeatCount="indefinite"/>
</circle>

<circle cx="310" cy="80" r="1.5">
<animate attributeName="cy"
values="80;45;80"
dur="4.5s"
repeatCount="indefinite"/>
</circle>

<circle cx="850" cy="80" r="2">
<animate attributeName="cy"
values="80;45;80"
dur="6s"
repeatCount="indefinite"/>
</circle>

<circle cx="980" cy="120" r="1.5">
<animate attributeName="cy"
values="120;85;120"
dur="5s"
repeatCount="indefinite"/>
</circle>

<circle cx="1110" cy="190" r="2">
<animate attributeName="cy"
values="190;150;190"
dur="4s"
repeatCount="indefinite"/>
</circle>

<circle cx="760" cy="350" r="1.5">
<animate attributeName="cy"
values="350;315;350"
dur="5s"
repeatCount="indefinite"/>
</circle>

</g>


<g fill="#F472B6">

<circle cx="240" cy="150" r="1.5">
<animate attributeName="cy"
values="150;120;150"
dur="5s"
repeatCount="indefinite"/>
</circle>

<circle cx="1040" cy="70" r="1.5">
<animate attributeName="cy"
values="70;35;70"
dur="4s"
repeatCount="indefinite"/>
</circle>

<circle cx="930" cy="350" r="2">
<animate attributeName="cy"
values="350;315;350"
dur="6s"
repeatCount="indefinite"/>
</circle>

</g>


<!-- ORBIT -->

<ellipse cx="600" cy="215"
rx="470"
ry="150"
fill="none"
stroke="#A855F7"
stroke-opacity=".14">

<animateTransform
attributeName="transform"
type="rotate"
from="0 600 215"
to="360 600 215"
dur="35s"
repeatCount="indefinite"/>

</ellipse>


<ellipse cx="600" cy="215"
rx="390"
ry="110"
fill="none"
stroke="#EC4899"
stroke-opacity=".1">

<animateTransform
attributeName="transform"
type="rotate"
from="360 600 215"
to="0 600 215"
dur="28s"
repeatCount="indefinite"/>

</ellipse>


<!-- TOP LABEL -->

<rect x="455" y="55"
width="290"
height="34"
rx="17"
fill="#171022"
stroke="#8B5CF6"
stroke-opacity=".5"/>

<circle cx="480" cy="72" r="5"
fill="#A855F7"
filter="url(#glow)">

<animate attributeName="opacity"
values="1;.25;1"
dur="1.5s"
repeatCount="indefinite"/>

</circle>

<text x="495" y="78"
fill="#C4B5FD"
font-family="Arial"
font-size="12"
font-weight="bold"
letter-spacing="2">
CSE • APPLIED AI • DEVELOPER
</text>


<!-- NAME -->

<text x="600" y="165"
text-anchor="middle"
fill="url(#nameGradient)"
font-family="Arial"
font-size="58"
font-weight="800"
letter-spacing="2">

NAVYA D

<animate attributeName="opacity"
values=".75;1;.75"
dur="4s"
repeatCount="indefinite"/>

</text>


<!-- LINE -->

<rect x="485" y="185"
width="230"
height="2"
rx="2"
fill="#A855F7">

<animate attributeName="width"
values="180;280;180"
dur="5s"
repeatCount="indefinite"/>

</rect>


<!-- DESCRIPTION -->

<text x="600" y="225"
text-anchor="middle"
fill="#D1D5DB"
font-family="Arial"
font-size="17">

Computer Science Engineering • Applied AI

</text>

<text x="600" y="252"
text-anchor="middle"
fill="#9CA3AF"
font-family="Arial"
font-size="13">

AI &amp; Data Science • Web Development • Open Source

</text>


<!-- SKILLS -->

<g font-family="Arial"
font-size="11"
text-anchor="middle">

<rect x="310" y="290"
width="105"
height="34"
rx="17"
fill="#120C1D"
stroke="#7C3AED"
stroke-opacity=".5"/>

<text x="362" y="312"
fill="#C4B5FD">PYTHON</text>


<rect x="430" y="290"
width="105"
height="34"
rx="17"
fill="#120C1D"
stroke="#7C3AED"
stroke-opacity=".5"/>

<text x="482" y="312"
fill="#C4B5FD">REACT</text>


<rect x="550" y="290"
width="105"
height="34"
rx="17"
fill="#120C1D"
stroke="#7C3AED"
stroke-opacity=".5"/>

<text x="602" y="312"
fill="#C4B5FD">AI / ML</text>


<rect x="670" y="290"
width="105"
height="34"
rx="17"
fill="#120C1D"
stroke="#7C3AED"
stroke-opacity=".5"/>

<text x="722" y="312"
fill="#C4B5FD">DATA</text>


<rect x="790" y="290"
width="105"
height="34"
rx="17"
fill="#120C1D"
stroke="#EC4899"
stroke-opacity=".45"/>

<text x="842" y="312"
fill="#F9A8D4">OPEN SOURCE</text>

</g>


<!-- FOOTER -->

<line x1="80" y1="365"
x2="1120" y2="365"
stroke="#6D28D9"
stroke-opacity=".3"/>

<text x="80" y="390"
fill="#6B7280"
font-family="monospace"
font-size="10"
letter-spacing="2">

LEARN • BUILD • CONTRIBUTE • CREATE

</text>

<text x="1120" y="390"
text-anchor="end"
fill="#6B7280"
font-family="monospace"
font-size="10">

SYSTEM: ONLINE

</text>


<!-- SCANNING ANIMATION -->

<rect x="80" y="362"
width="160"
height="1"
fill="#A855F7">

<animate attributeName="x"
values="80;960;80"
dur="8s"
repeatCount="indefinite"/>

</rect>

</svg>
